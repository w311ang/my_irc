version: '3.8'

services:
  irc-backend:
    image: ghcr.io/ergochat/ergo:stable
    container_name: my-ergo-server
    ports:
      - "6667:6667"
    volumes:
      - ./ergo-data:/ircd 
    restart: unless-stopped
    networks:
      - shared-net

  qwebirc-frontend:
    image: ghcr.io/tob1as/docker-qwebirc:latest
    container_name: my-qwebirc
    ports:
      - "9090:9090"
    volumes:
      - ./config.py:/qwebirc/config.py:ro
    restart: unless-stopped
    networks:
      - shared-net

  file-host:
    image: andreimarcu/linx-server:latest
    container_name: my-file-host
    ports:
      - "8080:8080"
    volumes:
      - ./linx-data:/data
    command: 
      - "-bind=0.0.0.0:8080"
      - "-sitename=Retro Storage"
      - "-allowpublicupload=true"
    restart: unless-stopped

networks:
  shared-net:
    external: true
    name: irc-shared-net
