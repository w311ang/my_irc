version: '3.8'

services:
  irc-backend:
    image: ghcr.io/ergochat/ergo:stable
    container_name: my-ergo-server
    volumes:
      - ./ergo-data:/ircd 
    restart: unless-stopped

  qwebirc-frontend:
    image: ghcr.io/tob1as/docker-qwebirc:latest
    container_name: my-qwebirc
    ports:
      - "9090:9090"
    volumes:
      - ./qwebirc-config.py:/qwebirc/config.py:ro
    restart: unless-stopped

  file-host:
    image: andreimarcu/linx-server:latest
    container_name: my-file-host
    ports:
      - "8080:8080"
    volumes:
      - ./linx-data/files:/data/files
      - ./linx-data/meta:/data/meta
    command: 
      - "-bind=0.0.0.0:8080"
      - "-sitename=Retro Storage"
    restart: unless-stopped

  lilywhitebot:
    image: ghcr.io/w311ang/lilywhitebot:master
    tty: true
    container_name: lilywhitebot
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./lilywhitebot/config.yml:/home/node/lwb/config.yml:ro
      - ./lilywhitebot/badwords.yml:/home/node/lwb/badwords.yml:ro

  napcat:
    environment:
      - NAPCAT_UID=${NAPCAT_UID}
      - NAPCAT_GID=${NAPCAT_GID}
      - ACCOUNT=1
    ports:
      - 6099:6099
    volumes:
      - ./napcat/cache:/app/.config/QQ
      - ./napcat/config:/app/napcat/config
      - ./napcat/plugins:/app/napcat/plugins
    container_name: napcat
    restart: unless-stopped
    image: mlikiowa/napcat-docker:latest
